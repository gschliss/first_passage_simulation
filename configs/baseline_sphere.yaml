# Baseline validation run: same geometry swept over dimension 1, 2, 3.
# Compare simulated MFPT against fpsim.analysis.theory.mfpt_spherical_shell.
name: baseline_sphere

geometry:
  type: spherical_shell
  R: 1.0     # reflecting outer radius
  a: 0.1     # absorbing target radius
  r0: 0.5    # starting radius

dims: [1, 2, 3]

simulation:
  n_agents: 5000
  D: 1.0
  dt: 1.0e-4
  t_max: 50.0
  seed: 0
