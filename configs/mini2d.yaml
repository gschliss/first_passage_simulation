# Small, fast 2D variant for tests and validation only (not a decision-log experiment).
# Same physics as lattice2d.yaml; ring-1 targets and a 2-ring cluster so captures and escapes happen quickly.
name: mini2d

geometry:
  dim: 2
  cell_radius: 10.0        # µm [L2]
  gap: 0.5                 # µm at closest approach [L2]
  target_ring: 1           # validation only (lattice2d uses 3)
  rings_beyond_target: 1   # validation only: 2 rings, 19 cells

receptors:
  n_per_cell: 3            # ~0.1% of the membrane [L18]
  capture_radius: 0.010    # µm from receptor center [L19]

diffusion:
  d_free: 10.0             # µm²/s [L20]
  d_bound: 0.5             # µm²/s [L20]

membrane:
  binding_layer: 0.010     # µm [L28]

stepping:
  mode: adaptive           # adaptive | fixed [L34]
  distance_fraction: 0.125 # [L30, L37]
  max_rate_dt: 0.05        # [L30]
  dt_cap: 0.01             # s [L30]
  dt_fixed: null           # fixed mode: null = strictest limit per sweep point [L34]

run:
  n_molecules: 1000
  t_max: 20000.0           # s [L41]
  seed: 0
  n_trajectories: 0
  trajectory_interval: 0.05

# Sweep points, numbered in order across sweeps (0-13). Each sweep gives two of
# free_fraction, bound_dwell (s, 1/k_off) and free_dwell (s, 1/k_on); one may be a list.
sweeps:
  dwell:                   # 5% free, vary the bound dwell [L23, L27, L39]
    free_fraction: 0.05
    bound_dwell: [0.005, 0.0707, 0.285, 1.0]
  free_fraction:           # free trips fixed at 15 ms, vary the free fraction [L38]
    free_dwell: 0.015
    free_fraction: [0.01, 0.05, 0.10, 0.20, 0.40]
  dwell_10pct:             # 10% free, vary the bound dwell [L45]
    free_fraction: 0.10
    bound_dwell: [0.005, 0.030, 0.135, 0.5, 1.0]
