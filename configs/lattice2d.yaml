# 2D packed-lattice model. Decision-log entries (docs/model_notes.md) in brackets.
name: lattice2d

geometry:
  dim: 2
  cell_radius: 10.0        # µm [L2]
  gap: 0.5                 # µm at closest approach [L2]
  target_ring: 3           # all cells in ring 3 are targets [L17]
  rings_beyond_target: 2   # cluster = 5 rings, 91 cells [L12]

receptors:
  n_per_cell: 3            # ~0.1% of the membrane [L18]
  capture_radius: 0.010    # µm from receptor center [L19]

diffusion:
  d_free: 10.0             # µm²/s [L20]
  d_bound: 0.5             # µm²/s [L20]

membrane:
  free_fraction: 0.05      # [L23]
  binding_layer: 0.010     # µm [L28]

stepping:
  mode: adaptive           # adaptive | fixed [L34]
  distance_fraction: 0.25  # [L30]
  max_rate_dt: 0.05        # [L30]
  dt_cap: 0.01             # s [L30]
  dt_fixed: null           # fixed mode: null = strictest limit per sweep point [L34]

run:
  bound_dwell: [0.005, 0.0707, 1.0]  # s, sweep of 1/k_off [L27]
  n_molecules: 1000
  t_max: 2000.0            # s, placeholder until the pilot run (build step 3)
  seed: 0
  n_trajectories: 0
  trajectory_interval: 0.05
